name: test
on:
  push:
  pull_request:
jobs:
  router-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m py_compile scripts/router.py
      - name: Tests
        run: python -m unittest discover -s tests -v
